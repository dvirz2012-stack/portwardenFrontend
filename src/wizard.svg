<svg xmlns="http://www.w3.org/2000/svg" width="520" height="309" viewBox="0 24 520 309" role="img" aria-labelledby="wz-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="wz-title">A wizard using a glowing staff to lift a card out of a list</title>
  <style>
    .wz-lift { transform-box: fill-box; transform-origin: center; animation: wz-lift 1s cubic-bezier(.3,.7,.2,1) .3s both; }
    .wz-float { animation: wz-float 6s ease-in-out 1.3s infinite; }
    .wz-appear { animation: wz-appear .6s ease-out .8s both; }
    @keyframes wz-lift { from { transform: translate(20px, 0) rotate(4deg); } }
    @keyframes wz-float { 50% { transform: translateY(-4px); } }
    @keyframes wz-appear { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .wz-lift, .wz-float, .wz-appear { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="wz-robe-clip">
      <path d="M157 182Q170 178 183 182Q197 186 199 200C206 240 214 288 223 322Q170 330 117 322C126 288 134 240 141 200Q143 186 157 182Z"/>
    </clipPath>
    <clipPath id="wz-hat-clip">
      <path d="M149 147L191 147L178 104Q174 88 198 76Q168 80 163 100Z"/>
    </clipPath>
  </defs>

  <!-- backdrop -->
  <path d="M96 332C92 214 176 118 292 112C404 106 486 196 480 332Z" fill="#6c63ff" opacity=".055"/>

  <!-- night sky -->
  <path d="M452 44A18 18 0 1 0 452 80A9 18 0 1 1 452 44Z" fill="#eeecf7"/>
  <g fill="#eeecf7">
    <circle cx="58" cy="72" r="1.6"/>
    <circle cx="112" cy="40" r="1.3" opacity=".7"/>
    <circle cx="214" cy="34" r="1.4" opacity=".6"/>
    <circle cx="336" cy="52" r="1.6"/>
    <circle cx="398" cy="96" r="1.2" opacity=".6"/>
    <circle cx="496" cy="126" r="1.5" opacity=".8"/>
    <circle cx="34" cy="190" r="1.2" opacity=".5"/>
  </g>

  <!-- ground -->
  <path d="M24 332H496" stroke="#2c2b3f" stroke-width="2" stroke-linecap="round"/>

  <!-- book stack -->
  <rect x="42" y="314" width="72" height="18" rx="3" fill="#3f3d56"/>
  <rect x="100" y="314" width="5" height="18" fill="#fff" opacity=".12"/>
  <rect x="50" y="298" width="60" height="16" rx="3" fill="#6c63ff"/>
  <rect x="57" y="298" width="5" height="16" fill="#fff" opacity=".3"/>
  <rect x="46" y="284" width="64" height="14" rx="3" fill="#d9d8e6"/>
  <rect x="95" y="284" width="5" height="14" fill="#6c63ff"/>

  <!-- potion -->
  <rect x="74" y="248" width="9" height="14" fill="#3f3d56"/>
  <rect x="72.5" y="244" width="12" height="6" rx="2" fill="#a0616a"/>
  <circle cx="78.5" cy="271" r="13" fill="#3f3d56"/>
  <path d="M65.5 271A13 13 0 0 0 91.5 271Z" fill="#a39dff"/>
  <circle cx="73.5" cy="265.5" r="2.5" fill="#fff" opacity=".5"/>

  <!-- staff -->
  <path d="M241 114V332" stroke="#a0616a" stroke-width="5" stroke-linecap="round"/>
  <path d="M231 109Q241 122 251 109" fill="none" stroke="#a0616a" stroke-width="4" stroke-linecap="round"/>

  <!-- shoes -->
  <path d="M138 332C138 324 146 320 156 321C164 322 167 327 167 332Z" fill="#3f3d56"/>
  <path d="M173 332C173 327 176 322 184 321C194 320 202 324 202 332Z" fill="#3f3d56"/>

  <!-- robe -->
  <path d="M157 182Q170 178 183 182Q197 186 199 200C206 240 214 288 223 322Q170 330 117 322C126 288 134 240 141 200Q143 186 157 182Z" fill="#6c63ff"/>
  <g clip-path="url(#wz-robe-clip)">
    <rect x="110" y="250" width="120" height="8" fill="#3f3d56"/>
  </g>

  <!-- sleeves + hands -->
  <circle cx="137" cy="270" r="7" fill="#ffb8b8"/>
  <path d="M146 192C134 204 128 236 124 264Q137 271 150 264C150 240 152 214 154 200Z" fill="#574fe0"/>
  <path d="M190 190Q214 190 234 205Q238 219 232 232Q211 228 196 214Z" fill="#574fe0"/>
  <circle cx="240" cy="214" r="7.5" fill="#ffb8b8"/>

  <!-- head + beard -->
  <circle cx="170" cy="160" r="15" fill="#ffb8b8"/>
  <path d="M154 150C150 178 156 218 170 246C184 218 190 178 186 150L183 150C182 163 177 168 170 168C163 168 158 163 157 150Z" fill="#e6e6e6"/>
  <path d="M160 167Q165 162 170 166Q175 162 180 167Q175 170.5 170 168.5Q165 170.5 160 167Z" fill="#cfcfd9"/>

  <!-- hat -->
  <ellipse cx="170" cy="148" rx="31" ry="6.5" fill="#574fe0"/>
  <path d="M149 147L191 147L178 104Q174 88 198 76Q168 80 163 100Z" fill="#6c63ff"/>
  <rect x="140" y="134" width="60" height="6" fill="#3f3d56" clip-path="url(#wz-hat-clip)"/>

  <!-- orb -->
  <circle cx="241" cy="99" r="28" fill="#6c63ff" opacity=".14"/>
  <circle cx="241" cy="99" r="19" fill="#6c63ff" opacity=".24"/>
  <circle cx="241" cy="99" r="10" fill="#c9c5ff"/>
  <circle cx="237.5" cy="95.5" r="3" fill="#fff" opacity=".85"/>

  <!-- list cards -->
  <rect x="306" y="120" width="150" height="44" rx="9" fill="#1c1b29" stroke="#2c2b3f"/>
  <circle cx="328" cy="142" r="10" fill="#34324a"/>
  <rect x="346" y="133" width="64" height="7" rx="3.5" fill="#34324a"/>
  <rect x="346" y="146" width="40" height="6" rx="3" fill="#2c2b3f"/>
  <rect x="420" y="135" width="24" height="14" rx="7" fill="#2c2b3f"/>

  <rect x="306" y="252" width="150" height="44" rx="9" fill="#1c1b29" stroke="#2c2b3f"/>
  <circle cx="328" cy="274" r="10" fill="#34324a"/>
  <rect x="346" y="265" width="54" height="7" rx="3.5" fill="#34324a"/>
  <rect x="346" y="278" width="34" height="6" rx="3" fill="#2c2b3f"/>
  <rect x="420" y="267" width="24" height="14" rx="7" fill="#2c2b3f"/>

  <!-- the lifted card -->
  <g class="wz-lift">
    <g class="wz-float">
      <g transform="rotate(-4 364 207)">
        <rect x="286" y="184" width="156" height="46" rx="9" fill="#232236" stroke="#6c63ff" stroke-opacity=".6"/>
        <circle cx="309" cy="207" r="10" fill="#6c63ff"/>
        <rect x="327" y="198" width="70" height="7" rx="3.5" fill="#46435f"/>
        <rect x="327" y="211" width="44" height="6" rx="3" fill="#34324a"/>
        <circle cx="422" cy="207" r="10" fill="#6c63ff"/>
        <path d="M417.5 207.5l3 3l6-6.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- magic trail + sparkles -->
  <g class="wz-appear">
    <path d="M256 94C292 80 304 132 290 176" fill="none" stroke="#a39dff" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 7.5"/>
    <path d="M272 64Q272 72 280 72Q272 72 272 80Q272 72 264 72Q272 72 272 64Z" fill="#eeecf7"/>
    <path d="M214 83Q214 88 219 88Q214 88 214 93Q214 88 209 88Q214 88 214 83Z" fill="#a39dff"/>
    <path d="M462 176Q462 182 468 182Q462 182 462 188Q462 182 456 182Q462 182 462 176Z" fill="#a39dff"/>
    <path d="M272 236Q272 240 276 240Q272 240 272 244Q272 240 268 240Q272 240 272 236Z" fill="#eeecf7"/>
  </g>
</svg>
