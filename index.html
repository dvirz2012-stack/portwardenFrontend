<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portwarden</title>
    <style>
        /* Figtree for the interface, a soft Fraunces for the page title */
        @import url("https://fonts.googleapis.com/css2?family=Figtree:wght@400..600&family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&display=swap");

        :root {
            color-scheme: light;

            --paper: #f5f4fa;          /* page: off-white with a hint of lavender */
            --surface: #ffffff;        /* table */
            --surface-hover: #f6f5fd;  /* row hover */
            --line: #e6e4f0;           /* borders (also the wizard's ground line) */
            --ink: #2f2e41;            /* main text: unDraw's dark */
            --ink-soft: #5d5b73;       /* secondary text */
            --ink-faint: #726f89;      /* column headers */
            --arcane: #6c63ff;         /* accent: unDraw's signature purple */
            --ember: #cc353c;          /* buttons */
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            background: var(--paper);
        }

        body {
            max-width: 60rem;
            margin: 0 auto;
            padding: clamp(1.5rem, 6vw, 4.5rem) clamp(1rem, 4vw, 2rem);
            font-family: "Figtree", "Segoe UI", system-ui, sans-serif;
            line-height: 1.5;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        ::selection {
            background: rgb(108 99 255 / 0.22);
        }

        /* ---------- Hero: the wizard stands on the table's top edge ---------- */

        .hero {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 1rem 2rem;
        }

        .hero-text {
            padding-bottom: 2.25rem;
        }

        .hero h1 {
            margin: 0 0 0.625rem;
            font-family: "Fraunces", Georgia, serif;
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            font-weight: 600;
            font-variation-settings: "SOFT" 100;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .hero p {
            margin: 0;
            max-width: 48ch;
            color: var(--ink-soft);
            text-wrap: pretty;
        }

        .hero-art {
            display: block;
            flex: none;
            width: min(100%, 26rem);
            height: auto;
            margin-bottom: -1px; /* lets the ground line merge with the table border */
        }

        /* ---------- Table ---------- */

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            font-size: 0.9375rem;
        }

        th,
        td {
            padding: 0.875rem 1.125rem;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }

        th {
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--ink-faint);
        }

        td {
            color: var(--ink-soft);
            font-variant-numeric: tabular-nums;
        }

        td:first-child {
            color: var(--ink);
            font-weight: 500;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        tr:hover td {
            background: var(--surface-hover);
        }

        tr:hover td:first-child {
            box-shadow: inset 2px 0 0 var(--arcane);
        }

        /* The cell holding the button hugs its content and sits on the right */
        td:has(> button) {
            width: 1%;
            white-space: nowrap;
            text-align: right;
        }

        /* ---------- Buttons ---------- */

        button {
            padding: 0.5rem 0.875rem;
            font: inherit;
            font-size: 0.8125rem;
            font-weight: 600;
            line-height: 1;
            color: var(--ember);
            background: rgb(204 53 60 / 0.07);
            border: 1px solid rgb(204 53 60 / 0.24);
            border-radius: 999px;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease,
            color 0.15s ease, transform 0.1s ease;
        }

        button:hover {
            color: #fff;
            background: var(--ember);
            border-color: var(--ember);
        }

        button:active {
            transform: scale(0.96);
        }

        button:focus-visible {
            outline: 2px solid var(--arcane);
            outline-offset: 2px;
        }

        /* ---------- Small screens & reduced motion ---------- */

        @media (max-width: 40rem) {
            .hero {
                flex-direction: column;
                align-items: stretch;
            }

            .hero-text {
                padding-bottom: 0;
            }

            .hero-art {
                align-self: flex-end;
                width: min(100%, 20rem);
            }

            table {
                font-size: 0.875rem;
            }

            th,
            td {
                padding: 0.75rem 0.625rem;
            }

            th:first-child,
            td:first-child {
                padding-left: 0.875rem;
            }

            th:last-child,
            td:last-child {
                padding-right: 0.875rem;
            }

            button {
                padding: 0.5rem 0.75rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            button {
                transition: none;
            }
        }
    </style>
</head>
<body>
<header class="hero">
    <div class="hero-text">
        <h1>PortWarden</h1>
        <p>Hi, this is PortWarden, a cool site that lets you kill Processes and
        see PIDs, Ports and Process Names, made for the developers that want to
        write code, not Commands! :)</p>

</header>

<table>
    <thead>
    <!-- Optional column names: <tr><th>Port</th><th>…</th></tr> -->
    </thead>
    <tbody id="port-list"></tbody>
</table>

<script src="./src/app.js" type="module"></script>
</body>
</html>
